[project]
name = "unbiased"
version = "0.0.1"
description = "Detecting local pockets of algorithmic bias with the Dendritic Cell Algorithm, an Artificial Immune System anomaly detector."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ananya Gupta" }]
license = { text = "MIT" }
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
